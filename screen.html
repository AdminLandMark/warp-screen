<style>

  html,
  body{
    height:100%;

  }

    from{

     สวิตช์ทดสอบการ์ด
     ===================================================== */

  #testSwitchPanel{

    position:fixed;

    left:20px;
    top:20px;

    z-index:9999;

    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 14px;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:14px;

    color:#fff;

    font-family:system-ui,sans-serif;

    cursor:default;

    transition:.25s ease;

  }


  #testSwitchPanel:hover{

    background:rgba(0,0,0,.9);

    border-color:rgba(255,255,255,.35);

  }


  #testSwitchLabel{

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

  }


  #testSwitchStatus{

    font-size:11px;

    color:#94a3b8;

    white-space:nowrap;

  }


  .switch{

    position:relative;

    width:48px;

    height:26px;

    flex:none;

  }


  .switch input{

    opacity:0;

    width:0;

    height:0;

  }


  .slider{

    position:absolute;

    inset:0;

    background:#475569;

    border-radius:999px;

    cursor:pointer;

    transition:.25s ease;

  }


  .slider:before{

    content:"";

    position:absolute;

    width:20px;

    height:20px;

    left:3px;

    top:3px;

    background:#fff;

    border-radius:50%;

    transition:.25s ease;

  }


  .switch input:checked + .slider{

    background:#22c55e;

  }


  .switch input:checked + .slider:before{

    transform:translateX(22px);

  }


  #testBadge{

    display:none;

    position:fixed;

    left:20px;

    top:76px;

    z-index:9998;

    padding:7px 12px;

    background:rgba(34,197,94,.9);

    color:#fff;

    border-radius:999px;

    font-size:12px;

    font-weight:800;

    box-shadow:0 5px 20px rgba(0,0,0,.3);

  }


  #testBadge.show{

  }


  /* ซ่อนสวิตช์เมื่อ Fullscreen */

  :-webkit-full-screen #testSwitchPanel{

     ===================================================== */

    height:1em;

    object-fit:contain;

    display:inline-block;

    vertical-align:-.12em;

/* =========================================================
   ฟังก์ชันหา Platform
   ========================================================= */

function getPlatformInfo(platform){

  const key =
    String(platform || '')
      .trim()
      .toLowerCase();


  return PLATFORM_INFO[key] || {

    name:key || 'Social',

    icon:null

  };

}


/* =========================================================
   สร้าง HTML ของ Platform
   ========================================================= */

function platformHTML(platform){

  const info =
    getPlatformInfo(platform);


  if(info.icon){

    return `

      <img
        src="${info.icon}"
        class="platform-icon"
        alt="${esc(info.name)}"
      >

    `;

  }


  return '✨';

}


/* =========================================================
   QR
   ========================================================= */

function makeQR(canvas, size){

  if(typeof QRCode === 'undefined')
    return;


  QRCode.toCanvas(

    canvas,

    SITE,

    {

      width:size,

      margin:1,

      color:{
        dark:'#000000',
        light:'#ffffff'
      }

    },

    e => {

      if(e)
        console.error('QR:',e);

    }

  );

}

/* =========================================================
   นาฬิกา + นับถอยหลัง

  clock.textContent =
    new Date().toLocaleTimeString(
      'th-TH',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    );


  const el =
    document.getElementById(
      'cd'
    );


  if(!el)
    return;


  /* =====================================================
     TEST MODE
     ===================================================== */

  if(TEST_MODE){

    const s =
      Math.max(
        0,

        Math.ceil(

          (
            new Date(
              TEST_CARD.end_at
            )

            -

            Date.now()

          ) / 1000

        )
      );


    el.textContent =
      `⏱ เหลือ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;


    return;

  }


  if(!queue.length)
    return;


  const o =
    queue[
      idx % queue.length
    ];


  if(!o?.end_at)
    return;


  const s =
    Math.max(

      0,

      Math.ceil(

        (
          new Date(
            o.end_at
          )

          -

          Date.now()

        ) / 1000

      )

    );


  el.textContent =
    `⏱ เหลือ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

},1000);


/* =========================================================
   ดึงคิว + ปิดการ์ดหมดเวลา
   ========================================================= */

/* =========================================================
   ลำดับอนุมัติจากข้อมูลเดิม

   admin เดิมบันทึก end_at = เวลาที่อนุมัติ + minutes
   ดังนั้นเราสามารถย้อนหาเวลาอนุมัติได้จาก

   end_at - minutes

   โดยไม่ต้องเพิ่ม column ใหม่ใน Supabase
   ========================================================= */
function approvedTime(o){

  const end =
    new Date(o.end_at).getTime();

  const minutes =
    Number(o.minutes) || 0;

  if(Number.isFinite(end)){

    return end - (minutes * 60000);

  }

  return new Date(o.created_at).getTime() || 0;
}


/* =========================================================
   จำลำดับอนุมัติเดิมไว้ในเครื่อง
   เพื่อไม่ให้การเริ่มเวลาของการ์ดเปลี่ยนลำดับคิว
   ========================================================= */
function getApprovalMap(){

  try{
    return JSON.parse(
      localStorage.getItem('warp_approval_times') || '{}'
    );
  }
  catch(e){
    return {};
  }
}

function sortByApprovalTime(list){

  const map = getApprovalMap();
  let changed = false;

  for(const o of (list || [])){
    if(!o?.id) continue;

    if(map[o.id] == null){
      map[o.id] = approvedTime(o);
      changed = true;
    }
  }

  if(changed){
    localStorage.setItem(
      'warp_approval_times',
      JSON.stringify(map)
    );
  }

  return (list || []).sort((a,b)=>{
    const ta = Number(map[a.id] ?? approvedTime(a));
    const tb = Number(map[b.id] ?? approvedTime(b));

    if(ta !== tb) return ta - tb;

    return String(a.id).localeCompare(String(b.id));
  });
}

  } =
    await sb
      .from('orders')
      .select('*')
      .eq('status','live');


  if(error){

    console.error(
      'LOAD LIVE ORDERS ERROR:',
      error
    );

    return null;

  }


  return sortByApprovalTime(data || []);

}


/* =========================================================
   เริ่มเวลาให้การ์ดที่กำลังขึ้นจอ

   สำคัญมาก:
   การ์ดที่ status = live แต่ยังไม่ถูกเลือกขึ้นจอ
   จะยังไม่ถูกนับเวลา

   end_at ของรายการที่รอคิวอาจถูกตั้งไว้ตั้งแต่ตอนอนุมัติ
   แต่เราจะ "เริ่มใหม่" เฉพาะตอนที่การ์ดถูกนำขึ้นจอจริง
   ========================================================= */
async function startCardTimer(o){

  const minutes =
    Number(o.minutes) || 0;

  const endAt =
    new Date(
      Date.now() + minutes * 60000
    ).toISOString();


  const {
    data,
    error
  } =
    await sb
      .from('orders')
      .update({
        end_at:endAt
      })
      .eq('id',o.id)
      .eq('status','live')
      .select('*');


  if(error){

    console.error(
      'START CARD TIMER ERROR:',
      error
    );

    return null;

  }


  if(!data || !data.length){

    console.warn(
      'ไม่สามารถเริ่มเวลาให้การ์ด:',
      o.id
    );

    return null;

  }


  return data[0];

}


/* =========================================================
   ดึงคิว + ควบคุมการ์ดทีละใบ

   กฎใหม่:

   1. ทุกใบที่ admin อนุมัติจะเป็น status = live
   2. แต่มีเพียง "ใบที่ขึ้นจอ" เท่านั้นที่เริ่มนับ end_at
   3. ใบที่รอคิวจะไม่ถูกปิดเมื่อ end_at เดิมหมด
   4. เมื่อใบปัจจุบันหมดเวลา -> ปิดเฉพาะใบนั้น
   5. จากนั้นเลือกใบถัดไปตามลำดับอนุมัติ
   6. เริ่มเวลาของใบใหม่ตอนขึ้นจอจริง
   ========================================================= */
async function load(){

  if(TEST_MODE)
    return;


  let liveOrders =
    await fetchLiveOrders();


  if(!liveOrders)
    return;


  if(!liveOrders.length){

    queue = [];
    idx = 0;
    curId = null;

    localStorage.removeItem(
      'warp_current_card_id'
    );

    return idle();

  }


  /* =====================================================
     ถ้ามีการ์ดปัจจุบันอยู่
     ===================================================== */

  let current =
    liveOrders.find(
      o => o.id === curId
    );


  /* =====================================================
     กรณีรีเฟรชหน้า

     จำ ID ของการ์ดที่กำลังขึ้นจอไว้ใน browser
     ===================================================== */

  if(!current){

    const savedId =
      localStorage.getItem(
        'warp_current_card_id'
      );


    if(savedId){

      current =
        liveOrders.find(
          o => o.id === savedId
        );

    }

  }


  /* =====================================================
     ถ้ามีการ์ดปัจจุบัน
     ===================================================== */

  if(current){

    curId = current.id;

    localStorage.setItem(
      'warp_current_card_id',
      current.id
    );


    /*
     * ตรวจเฉพาะการ์ดที่กำลังขึ้นจอเท่านั้น
     * ว่าหมดเวลาหรือยัง
     */

    const currentEnd =
      current.end_at
        ? new Date(current.end_at).getTime()
        : 0;


    if(currentEnd > Date.now()){

      queue = liveOrders;

      idx = Math.max(
        0,
        liveOrders.findIndex(
          o => o.id === current.id
        )
      );

      /*
       * ยังไม่หมดเวลา
       * ห้ามสลับการ์ด
       */
      render();

      return;

    }


    /*
     * การ์ดปัจจุบันหมดเวลาแล้ว
     * ปิดเฉพาะการ์ดนี้
     */

    const {
      error:doneError
    } =
      await sb
        .from('orders')
        .update({
          status:'done',
          end_at:new Date().toISOString()
        })
        .eq('id',current.id)
        .eq('status','live');


    if(doneError){

      console.error(
        'FINISH CARD ERROR:',
        doneError
      );

      return;

    }


    /*
     * ล้าง current เพื่อให้เลือกใบถัดไป
     */

    curId = null;

    localStorage.removeItem(
      'warp_current_card_id'
    );


    /*
     * ดึงรายการใหม่อีกครั้ง
     */

    liveOrders =
      await fetchLiveOrders();


    if(!liveOrders || !liveOrders.length){

      queue = [];
      idx = 0;

      return idle();

    }

  }


  /* =====================================================
     เลือกการ์ดถัดไป

     สำคัญ:
     ไม่ดูว่า end_at เดิมหมดหรือยัง
     เพราะ end_at เดิมของใบที่รอคิวไม่มีความหมาย
     ===================================================== */

  const next =
    liveOrders[0];


  if(!next){

    queue = [];
    idx = 0;

    return idle();

  }


  /* =====================================================
     เริ่มนับเวลาของการ์ดนี้ "ตอนขึ้นจอจริง"
     ===================================================== */

  const started =
    await startCardTimer(next);


  if(!started)
    return;


  /*
   * ใช้ข้อมูลหลัง update
   */

  queue =
    liveOrders.map(o =>
      o.id === started.id
        ? started
        : o
    );


  /*
   * อย่าตั้ง curId ก่อน render()
   * เพราะ render() จะข้ามการวาดทันทีถ้า o.id === curId
   * ให้ render เป็นคนตั้ง curId เอง
   */
  curId = null;


  idx = 0;


  localStorage.setItem(
    'warp_current_card_id',
    started.id
  );


  render();

}


/* =========================================================
   เปลี่ยนการ์ดเมื่อ "การ์ดปัจจุบัน" หมดเวลาเท่านั้น

   ห้ามดู end_at ของการ์ดที่รอคิว
   ========================================================= */
let expiryLoading = false;

setInterval(async()=>{

  if(TEST_MODE)
    return;


  if(!curId)
    return;


  const current =
    queue.find(
      o => o.id === curId
    );


  if(!current?.end_at)
    return;


  const expired =
    new Date(current.end_at).getTime()
    <= Date.now();


  if(!expired || expiryLoading)
    return;


  expiryLoading = true;


  try{

    await load();

  }
  finally{

    expiryLoading = false;

  }

},1000);


/* =========================================================
   โหลดข้อมูลทุก 10 วินาที
   ========================================================= */

setInterval(
  load,
  10000
);


/* =========================================================
   Supabase Realtime
   ========================================================= */

sb
  .channel('screen')

  .on(

    'postgres_changes',

    {
      event:'*',
      schema:'public',
      table:'orders'
    },

    load

  )

  .subscribe();


/* =========================================================
   Fullscreen
   ========================================================= */

addEventListener(
  'click',
  ()=>{

    if(!document.fullscreenElement){

      document
        .documentElement
        .requestFullscreen?.();

    }

  }
);


/* =========================================================
   Resize
   ========================================================= */

addEventListener(
  'resize',
  ()=>{

    if(TEST_MODE){

      renderTestCard();

      return;

    }


    /* ห้ามล้าง curId ตอน resize เพราะการ์ดเดิมยังต้องเล่นต่อ */
    if(curId && queue.length){

      const current = queue.find(o => o.id === curId);

      if(current){
        render();
        return;
      }
    }

    queue.length
      ? load()
      : idle();

  }
);


/* =========================================================
   เริ่มระบบ
   ========================================================= */

(async()=>{

  S =
    await getSettings();


  idle();


  load();

})();

</script>
