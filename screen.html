<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 body{overflow:hidden;cursor:none}
 @keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
 .fade{animation:fade .6s ease}
</style>
</head>
<body class="bg-black text-white font-[system-ui] h-screen">
<div id="stage" class="h-screen grid place-items-center"></div>

<script src="config.js"></script><script src="app.js"></script>
<script>
let queue=[], idx=0;

async function load(){
  const { data } = await sb.from('orders')
    .select('*').eq('status','live')
    .gt('end_at', new Date().toISOString())
    .order('created_at',{ascending:true});
  queue = data||[];
  if(idx >= queue.length) idx = 0;
  show();
}

function show(){
  if(!queue.length){
    stage.innerHTML = `<div class="text-center opacity-40">
      <div class="text-7xl mb-4">🌃</div>
      <p class="text-3xl font-black">NEON BAR</p>
      <p class="text-lg mt-2">สแกน QR ที่โต๊ะเพื่อส่งการ์ดขึ้นจอ</p></div>`;
    return;
  }
  const o = queue[idx % queue.length];
  const ic = { ig:'📸', fb:'💙', tt:'🎵' }[o.platform] || '✨';
  stage.innerHTML = `
    <div class="fade flex items-center gap-12 px-12">
      <img src="${o.image_url}" class="h-[80vh] rounded-3xl object-cover shadow-2xl shadow-fuchsia-500/30">
      <div class="max-w-lg">
        <p class="text-6xl font-black bg-gradient-to-r from-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">
          ${ic} @${esc(o.handle)}</p>
        <p class="text-3xl mt-6 text-slate-200 leading-snug">${esc(o.message||'')}</p>
      </div>
    </div>`;
}

setInterval(()=>{ idx++; show(); }, 8000);
setInterval(load, 10000);

sb.channel('screen').on('postgres_changes',
  { event:'*', schema:'public', table:'orders' }, load).subscribe();
load();
</script>
</body></html>
