<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen · Warp</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.js"></script>
<style>
  html,body{height:100%;overflow:hidden;background:#000}
  body{cursor:none}
  @keyframes in{from{opacity:0;transform:scale(.97)}}
  .anim{animation:in .7s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body class="text-white font-[system-ui]">
<div id="bg" class="fixed inset-0 bg-center bg-cover scale-110 blur-3xl opacity-30 transition-all duration-1000"></div>
<div class="fixed inset-0 bg-black/50"></div>
<div id="stage" class="relative h-screen w-screen grid place-items-center p-[3vh]"></div>
<div id="qrCorner" class="hidden fixed top-[2.5vh] right-[2.5vw] z-20 flex items-center gap-[1.5vh] bg-black/60 backdrop-blur rounded-[2vh] p-[1.5vh] ring-1 ring-white/20">
  <canvas id="qrSmall" class="rounded-[1vh] bg-white p-[.6vh]"></canvas>
</div>
<script src="config.js"></script>
<script>
  // 1. กำหนดค่า ICON ให้เป็น URL โลโก้สีขาว (แก้สีเพี้ยน)
  const ICON = {
    ig: 'https://cdn.simpleicons.org/instagram/ffffff',
    fb: 'https://cdn.simpleicons.org/facebook/ffffff',
    tt: 'https://cdn.simpleicons.org/tiktok/ffffff',
    line: 'https://cdn.simpleicons.org/line/ffffff'
  };
</script>
<script src="app.js"></script>
<script>
  // 2. ปรับฟังก์ชัน render ให้ดึงจาก ICON ที่เรากำหนดไว้
  function render(){
    if(!queue.length) return idle();
    const o = queue[idx % queue.length];
    if(o.id === curId) return;
    curId = o.id;
    bg.style.backgroundImage = `url(${o.image_url})`;
    
    // ดึง URL จาก object ICON ที่เราแก้ไว้ข้างบน
    const iconUrl = ICON[o.platform] || '✨';

    stage.innerHTML = `
      <div class="anim flex items-center justify-center gap-[4vh] w-full h-full">
        <img src="${o.image_url}" class="h-[80vh] aspect-[3/4] object-cover rounded-[3vh] ring-2 ring-white/20">
        <div class="text-left max-w-[35vw]">
          <div class="flex items-center gap-[2vh]">
            <img src="${iconUrl}" class="w-[6vh] h-[6vh]" alt="icon">
            <p class="text-[7vh] font-black bg-gradient-to-r from-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">@${esc(o.handle)}</p>
          </div>
          <p class="text-[3.4vh] mt-[2.5vh] text-slate-100">${esc(o.message || '')}</p>
        </div>
      </div>`;
    qrCorner.classList.remove('hidden');
    QRCode.toCanvas(qrSmall, location.origin+'/', { width: 100, margin: 1, color: { dark:'#000000', light:'#ffffff' } });
  }
</script>
</body></html>
