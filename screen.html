<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen · Warp</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.js"></script>
<style>
  html,body{height:100%;overflow:hidden;background:#000}
  body{cursor:none}
  .anim{animation:in .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:scale(.97)}}
  /* บังคับการแสดงผลให้เป็นไปตามที่เราจัดวาง */
  #stage{width:100vw!important;height:100vh!important;display:flex!important;align-items:center!important;padding:5vh!important}
</style>
</head>
<body class="text-white font-[system-ui]">

<div id="bg" class="fixed inset-0 bg-center bg-cover scale-110 blur-3xl opacity-30 transition-all duration-1000"></div>
<div class="fixed inset-0 bg-black/50"></div>

<!-- กล่อง QR ที่ย้ายมากลางขวา -->
<div id="qrCorner" class="hidden fixed top-[18vh] right-[5vw] z-20 flex flex-col items-center gap-[1vh] bg-black/60 backdrop-blur rounded-[2vh] p-[2vh] ring-1 ring-white/20">
  <canvas id="qrSmall" class="rounded-[1vh] bg-white p-[.5vh]"></canvas>
  <p class="text-[1.8vh] font-bold">สแกนส่งการ์ด</p>
</div>

<!-- พื้นที่แสดงผลหลัก -->
<div id="stage" class="relative"></div>

<script src="config.js"></script>
<script>
  // ฟังก์ชันดึงโลโก้ตามแพลตฟอร์ม
  function getLogo(p){
    const map = { ig:'instagram/E4405F', fb:'facebook/1877F2', tt:'tiktok/ffffff', line:'line/06C755' };
    return `https://cdn.simpleicons.org/${map[p] || 'instagram/ffffff'}`;
  }
</script>
<script src="app.js"></script>
<script>
  // เราจะ override ฟังก์ชัน render เดิมของ app.js ด้วยฟังก์ชันนี้
  const originalRender = render; 
  render = function(){
    if(!queue.length) return idle();
    const o = queue[idx % queue.length];
    if(o.id === curId) return;
    curId = o.id;

    bg.style.backgroundImage = `url(${o.image_url})`;
    
    // จัดวาง Layout ใหม่ทั้งหมด
    stage.innerHTML = `
      <div class="anim flex items-center gap-[5vw] w-full">
        <img src="${o.image_url}" class="h-[80vh] aspect-[3/4] object-cover rounded-[3vh] ring-2 ring-white/20">
        
        <div class="flex flex-col items-center w-[30vw] mt-[25vh]">
           <img src="${getLogo(o.platform)}" class="w-[8vh] h-[8vh] mb-[2vh]">
           <p class="text-[6vh] font-black bg-gradient-to-r from-fuchsia-400 to-cyan-400 bg-clip-text text-transparent text-center break-all">
             @${esc(o.handle)}
           </p>
           <p class="text-[3vh] mt-[1vh] text-slate-200 text-center">${esc(o.message || '')}</p>
        </div>
      </div>`;

    qrCorner.classList.remove('hidden');
    QRCode.toCanvas(qrSmall, location.origin+'/', { width: 120, margin: 1, color: { dark:'#000000', light:'#ffffff' } });
  };
</script>
</body></html>
